<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>taskrecap</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<a class="skip" id="skip" href="#"></a>
<div class="banner" role="note" id="banner"></div>
<div class="wrap">
  <header class="top">
    <div class="logo" aria-hidden="true">◈</div>
    <div class="brand"><span id="title">taskrecap</span><small id="tagline"></small></div>
    <button class="coverage" id="coverage" type="button" aria-pressed="false" hidden>
      <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><circle class="cv-bg" cx="13" cy="13" r="10.5" fill="none" stroke-width="4"/><circle class="cv-fg" id="cv-fg" cx="13" cy="13" r="10.5" fill="none" stroke-width="4" stroke-linecap="round" transform="rotate(-90 13 13)" stroke-dasharray="0 66"/></svg>
      <span id="coverage-text"></span>
    </button>
    <div class="usage" id="usage" aria-live="polite"></div>
    <select class="theme lang" id="lang"></select>
    <button class="theme" id="theme" type="button"></button>
  </header>
  <main id="home" tabindex="-1" hidden>
    <h1 id="home-title" tabindex="-1"></h1>
    <p class="lead" id="home-lead"></p>
    <div class="search">
      <span aria-hidden="true"><svg class="ico" viewBox="0 0 24 24" focusable="false"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></span>
      <input id="q" type="search" autocomplete="off">
    </div>
    <div class="controls">
      <div class="modes">
        <span class="chip free" id="mode-free"></span>
        <button class="cta ai ghost" id="ai-search" type="button" style="min-height:40px;padding:8px 16px;font-size:15px"></button>
      </div>
      <p class="note search-note" id="search-note" style="margin-top:12px"></p>
    </div>
    <div id="ai-note"></div>
    <p class="note scope" id="search-scope" role="status" hidden></p>
    <details class="filesearch" id="filesearch">
      <summary id="filesearch-title"></summary>
      <input id="fq" type="search" autocomplete="off">
      <div id="filelist" aria-live="polite"></div>
    </details>
    <div class="aibox" id="aibox" aria-live="polite"></div>
    <div id="airesults" class="airesults"></div>
    <section class="organize" id="organize" hidden aria-labelledby="org-h"></section>
    <div class="viewbar" id="viewbar" hidden>
      <div class="seg" id="seg" role="group">
        <button type="button" id="view-timeline" aria-pressed="true"></button>
        <button type="button" id="view-cards" aria-pressed="false"></button>
      </div>
      <div class="vzfilters" id="vzfilters">
        <label><span id="vz-repo-label"></span><select id="vz-repo"></select></label>
        <label><span id="vz-period-label"></span><select id="vz-period"></select></label>
        <span class="vzcustom" id="vz-custom" hidden>
          <label><span id="vz-from-label"></span><input type="date" id="vz-from"></label>
          <label><span id="vz-to-label"></span><input type="date" id="vz-to"></label>
        </span>
        <button class="cta ghost sm" type="button" id="vz-reset"></button>
        <span class="vzmsg" id="vz-msg" role="status"></span>
      </div>
      <span class="capfilter" id="capfilter" hidden><span id="capfilter-text"></span><button type="button" id="capfilter-clear"></button></span>
    </div>
    <section class="vz" id="timeline" hidden aria-labelledby="vz-title"></section>
    <div class="grid" id="grid" role="list" style="margin-top:24px"></div>
    <section class="emptygroup" id="emptygroup" hidden></section>
    <section class="hiddenbox" id="hiddenbox" hidden></section>
    <div class="nonewrap" id="nonewrap" hidden>
      <p class="empty" id="none"></p>
      <div class="nonehint" id="none-extra" hidden>
        <p class="note" id="none-hint"></p>
        <button class="cta ai ghost" id="none-ai" type="button" style="min-height:40px;padding:8px 16px;font-size:15px"></button>
      </div>
    </div>
  </main>
  <main id="detail" tabindex="-1" hidden></main>
  <p class="empty" id="loading"></p>
</div>
<div class="vz-tip" id="vz-tip" role="tooltip" hidden></div>
<div class="unitmenu" id="unitmenu" role="menu" hidden></div>
<div class="udlg" id="unitdlg" hidden>
  <div class="udbackdrop" id="ud-backdrop"></div>
  <div class="udpanel" role="dialog" aria-modal="true" aria-labelledby="ud-title" tabindex="-1"></div>
</div>
<div class="udlg" id="orgdlg" hidden>
  <div class="udbackdrop" id="org-backdrop"></div>
  <div class="udpanel orgpanel" role="dialog" aria-modal="true" aria-labelledby="org-dlg-title" tabindex="-1"></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<div class="evoverlay" id="evidence" hidden>
  <div class="evbackdrop" id="ev-backdrop"></div>
  <aside class="evpanel" id="ev-panel" role="dialog" aria-modal="true" aria-labelledby="ev-title" tabindex="-1"></aside>
</div>
<script src="/js/core.js"></script>
<script src="/js/home.js"></script>
<script src="/js/timeline.js"></script>
<script src="/js/ai.js"></script>
<script src="/js/files.js"></script>
<script src="/js/units.js"></script>
<script src="/js/organize.js"></script>
<script src="/js/detail.js"></script>
<script src="/js/evidence.js"></script>
<script src="/js/main.js"></script>
</body>
</html>
